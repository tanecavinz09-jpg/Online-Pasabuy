<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Pasabuy: Mamburao Community Delivery App</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',surface:'var(--surface)',ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',chip:'var(--chip)',brand:'var(--brand)',accent:'#ff5a3d'},fontFamily:{display:['"Bricolage Grotesque"','Figtree','system-ui','sans-serif'],sans:['Figtree','system-ui','sans-serif']}}}};
</script>
<style>
:root{--bg:#f6f4fb;--surface:#fff;--ink:#1d1633;--muted:#665f7d;--line:#ddd6ee;--chip:#ece7f8;--brand:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130d24;--surface:#1e1636;--ink:#efeafc;--muted:#a79fc2;--line:#3a2d5e;--chip:#2a2048;--brand:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130d24;--surface:#1e1636;--ink:#efeafc;--muted:#a79fc2;--line:#3a2d5e;--chip:#2a2048;--brand:#a78bfa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
:focus-visible{outline:3px solid #f5b83d;outline-offset:2px}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.dot{animation:ping2 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;outline:0;touch-action:none;background:var(--chip)}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-pane>svg,.leaflet-pane>canvas{pointer-events:none}.leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-zoom-animated{transform-origin:0 0}
.pin{display:grid;place-items:center;font:800 16px Figtree,sans-serif;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.35)}.pin-P{background:#fff;color:#111;border:3px solid #111}.pin-D{background:#e11d48;color:#fff;border:3px solid #fff}.pin-R{background:#7c3aed;color:#fff;border:3px solid #fff}
</style>
</head>

   ${has?html`<div class="font-display text-xl sm:text-2xl font-extrabold">Item Actual ${pp(r.actualPrice)} (from ${pp(r.budget)} budget) + Service ${pp(r.serviceFee)} = Final ${pp(r.finalTotal)}</div>
     ${r.sukli>0&&html`<div class="rounded-xl bg-emerald-100 text-emerald-900 p-3"><div class="font-display text-2xl font-extrabold">Sukli: ${pp(r.sukli)}</div><div class="font-semibold">Sukli mo: ${pp(r.sukli)} ibabalik ni rider</div></div>`}
     ${r.kulang>0&&html`<div class="rounded-xl bg-red-100 text-red-900 p-3"><div class="font-display text-2xl font-extrabold">Kulang ${pp(r.kulang)}</div><div class="font-semibold">Customer needs to add ${pp(r.kulang)}</div></div>`}
     ${r.sukli===0&&r.kulang===0&&html`<div class="rounded-xl bg-emerald-100 text-emerald-900 p-3 font-semibold">Eksakto ang budget. Walang sukli.</div>`}
     <p class="text-sm text-muted">Original total was ${pp(r.originalTotal)} (item budget + service).</p>`
   :html`<div class="font-display text-xl sm:text-2xl font-extrabold">Item ${pp(r.budget)} (budget) + Service ${pp(r.serviceFee)} = Total ${pp(r.budget+r.serviceFee)} <span class="text-sm font-bold text-emerald-600">🔒 LOCKED</span></div>
     ${(r.status==="Picked Up"||r.status==="On The Way")&&html`<p class="text-sm text-violet-600 font-semibold">Rider is confirming the actual price of the item.</p>`}`}
   ${r.receipt&&html`<div><img src=${r.receipt} alt="Receipt photo" class="max-h-48 rounded-lg border border-line"/><p class="text-xs text-muted">Resibo from rider</p></div>`}
   <p class="text-sm text-muted">Route P to D: ${route} km. Rider: ${r.pasabuyerName} ${starTxt(r.pasabuyerId)}</p></div>`;
}
function ActualCard({r,cu,a}){
  const [p,setP]=useState(""),[f,setF]=useState(null),[busy,setBusy]=useState(false);
  if(cu.role!=="Pasabuyer"||r.pasabuyerId!==cu.id||r.actualPrice!=null||(r.status!=="Picked Up"&&r.status!=="On The Way"))return null;
  const n=+p,d=r.budget-n;
  return html`<form class="rounded-2xl border-2 border-amber-400 bg-surface p-4 space-y-3" onSubmit=${async e=>{e.preventDefault();if(!(n>0))return;setBusy(true);let img=null;if(f){try{img=await shrink(f)}catch(x){}}setBusy(false);a.actual(r.id,n,img)}}>
   <h3 class="font-display text-xl font-extrabold">Magkano actual na binili?</h3>
   <label class="block text-sm font-semibold">Actual price ng item (e.g. 180)<input type="number" min="0.01" step="any" required value=${p} onInput=${e=>setP(e.target.value)}/></label>
   <label class="block text-sm font-semibold">Upload resibo (optional, image)<input type="file" accept="image/*" onChange=${e=>setF(e.target.files[0]||null)}/></label>
   ${n>0&&html`<p class=${"rounded-xl p-3 font-semibold "+(d>=0?"bg-emerald-100 text-emerald-900":"bg-red-100 text-red-900")}>${d>=0?"Sukli = Customer Budget ("+pp(r.budget)+") - Actual Price ("+pp(n)+") = "+pp(d)+" sukli":"Kulang = Actual Price ("+pp(n)+") - Customer Budget ("+pp(r.budget)+") = "+pp(-d)+". Customer needs to add."}</p>`}
   <button class=${B2} disabled=${busy}>Confirm Actual Price</button><p class="text-xs text-muted">You can confirm this only once. It unlocks the Delivered button.</p></form>`;
}
function Settle({r,cu,a}){
  if(r.status!=="Delivered"||r.actualPrice==null)return null;
  const own=r.customerId===cu.id,k=r.kulang>0;
  if(!k&&r.sukli===0)return html`<div class="rounded-2xl border border-line bg-surface p-4 font-semibold">Confirmed: Binayaran mo ${pp(r.originalTotal)}, actual ${pp(r.finalTotal)}. Walang sukli.</div>`;
  const q="Confirmed: Binayaran mo "+pp(r.originalTotal)+", actual "+pp(r.finalTotal)+", "+(k?"kulang "+pp(r.kulang)+" naidagdag mo na?":"sukli "+pp(r.sukli)+" naibalik na?");
  return html`<div class="rounded-2xl border-2 border-emerald-500 bg-surface p-4 space-y-2"><p class="font-semibold">${q}</p>
   ${r.settled==="yes"&&html`<p class="font-bold text-emerald-600">✓ Yes. Customer confirmed.</p>`}
   ${r.settled==="no"&&html`<p class="font-bold text-red-600">✗ No. Customer says it is not settled yet. Please settle in chat.</p>`}
   ${own&&r.settled!=="yes"&&html`<div class="flex gap-2"><button class=${BTN+"bg-emerald-600 text-white"} onClick=${()=>a.settle(r.id,true)}>Yes</button>${r.settled!=="no"&&html`<button class=${BTN+"bg-red-600 text-white"} onClick=${()=>a.settle(r.id,false)}>No</button>`}</div>`}
   ${!own&&!r.settled&&html`<p class="text-sm text-muted">Waiting for the customer to confirm…</p>`}</div>`;
}
function Gps({cu,sel,setSel,a}){
  const t=reqs().filter(r=>r.customerId===cu.id||r.pasabuyerId===cu.id||(r.status==="Pending"&&r.offers.some(o=>o.riderId===cu.id)));
  if(!t.length)return html`<div class="border border-dashed border-line rounded-2xl p-8 text-center text-muted">Nothing to track yet. ${cu.role==="Customer"?"Post a request, then review the offers you receive here.":"Send an offer on a pending request first."}</div>`;
  const r=t.find(x=>x.id===sel)||t[0],isC=r.customerId===cu.id,mine=r.pasabuyerId===cu.id,idx=STEPS.indexOf(r.status),nx=STEPS[idx+1],pend=r.status==="Pending";
  return html`<div class="space-y-4">
   <label class="block text-sm font-semibold">Select request<select value=${r.id} onChange=${e=>setSel(e.target.value)}>${t.map(x=>html`<option key=${x.id} value=${x.id}>${x.item} (${x.status})</option>`)}</select></label>
   <${Money} r=${r}/>
   ${pend?html`<div class="space-y-3"><h2 class="font-display text-xl font-extrabold">${isC?"Offers from pasabuyers":"Your offers"}</h2><${Offers} r=${r} cu=${cu} a=${a}/>
     ${canOffer(r,cu)&&html`<button class=${B2} onClick=${()=>a.offer(r.id)}>Offer Price</button>`}
     <div class="rounded-2xl border border-dashed border-line p-6 text-center text-muted">📍 Waiting for offer acceptance. The map and delivery timeline open after the customer accepts an offer.</div></div>`
   :html`<div class="space-y-4">
     <ol class="flex flex-wrap gap-2" aria-label="Delivery progress">${STEPS.map((s,i)=>html`<li key=${s} class=${"rounded-full px-3 py-1 text-sm font-semibold "+(i<=idx?"bg-brand text-white":"bg-chip text-muted")}>${s}</li>`)}</ol>
     ${mine&&nx&&html`<div><div class="flex flex-wrap gap-2">${STEPS.slice(1).map(s=>html`<button key=${s} class=${B1+" disabled:opacity-40"} disabled=${s!==nx||(s==="Delivered"&&r.actualPrice==null)} onClick=${()=>a.step(r.id,s)}>${s}</button>`)}</div><p class="text-sm text-muted mt-1">Tap the next step. The R marker moves only when you tap.${nx==="Delivered"&&r.actualPrice==null?" Confirm the actual price (below) to unlock Delivered.":""}</p></div>`}
     ${isC&&nx&&html`<p class="font-semibold text-violet-600">Waiting for rider… (${r.status}. Next: ${nx})</p>`}
     ${!isC&&!mine&&html`<p class="text-muted">Another pasabuyer was chosen for this request.</p>`}
     ${r.status==="Delivered"&&html`<p class="font-semibold text-emerald-600">Delivered ✓</p>`}
     <${ActualCard} r=${r} cu=${cu} a=${a}/>
     <${MapView} r=${r}/>
     <${Settle} r=${r} cu=${cu} a=${a}/>
     ${r.status==="Delivered"&&html`<${Rate} r=${r} cu=${cu} a=${a}/>`}</div>`}</div>`;
}
function Chat({cu,sel,setSel,say,a}){
  const t=reqs().filter(r=>canChat(r,cu)),[txt,setTxt]=useState(""),end=useRef(null);
  const r=t.find(x=>x.id===sel)||t[0],msgs=r?(rd(KC,{})[r.id]||[]):[];
  useEffect(()=>{if(end.current)end.current.scrollTop=end.current.scrollHeight},[msgs.length,r&&r.id]);
  if(!r)return html`<div class="border border-dashed border-line rounded-2xl p-8 text-center text-muted">Chat opens when a pasabuyer sends an offer on a request.</div>`;
  function send(e){e.preventDefault();const v=txt.trim();if(!v)return;if(sendChat(cu,r.id,v))setTxt("");else say("You can’t chat on this request.")}
  const SY={offer:"bg-amber-100 text-amber-950",accepted:"bg-emerald-100 text-emerald-900",declined:"bg-red-100 text-red-900",status:"bg-violet-100 text-violet-900"};
  return html`<div class="max-w-2xl space-y-3">
   <label class="block text-sm font-semibold">Chat for<select value=${r.id} onChange=${e=>setSel(e.target.value)}>${t.map(x=>html`<option key=${x.id} value=${x.id}>${x.item} (${x.status})</option>`)}</select></label>
   ${cu.role==="Customer"&&r.status==="Pending"&&r.offers.some(o=>o.status==="pending")&&html`<div class="rounded-2xl border border-amber-400 bg-amber-100 text-amber-950 p-3"><div class="font-bold mb-2">🔔 New offer! ${r.offers.filter(o=>o.status==="pending").map(o=>"Si "+o.riderName+" nag-offer "+pp(o.price)).join(", ")}</div><${Offers} r=${r} cu=${cu} a=${a}/></div>`}
   <div ref=${end} class="rounded-2xl border border-line bg-surface p-3 h-80 overflow-auto space-y-2">
    ${msgs.length?msgs.map((m,i)=>m.sys?html`<div key=${i} class=${"rounded-xl px-3 py-2 text-sm font-semibold "+SY[m.sys]}>${m.text}</div>`:html`<div key=${i} class=${"flex "+(m.from===cu.id?"justify-end":"justify-start")}><div class=${"max-w-[80%] rounded-2xl px-3 py-2 "+(m.from===cu.id?"bg-brand text-white":"bg-chip")}><div class="text-xs opacity-75 font-semibold">${m.name}</div>${m.text}</div></div>`):html`<p class="text-muted text-sm">No messages yet.</p>`}</div>
   <form onSubmit=${send} class="flex gap-2"><input value=${txt} onInput=${e=>setTxt(e.target.value)} maxLength="300" placeholder="Write a message" aria-label="Message"/><button class=${B1}>Send</button></form></div>`;
}
function OfferModal({r,close,onSend}){
  const [p,setP]=useState(""),[m,setM]=useState("");
  useEffect(()=>{const k=e=>e.key==="Escape"&&close();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[]);
  return html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${e=>e.target===e.currentTarget&&close()}>
   <form role="dialog" aria-modal="true" aria-label="Offer price" class="bg-surface rounded-2xl p-5 w-full max-w-lg" onSubmit=${e=>{e.preventDefault();onSend(p,m)}}>
    <h2 class="font-display text-2xl font-extrabold">Offer price</h2>
    <p class="text-sm text-muted">${r.item}. Item budget ${pp(r.budget)} (locked, you cannot change it).</p>
    <label class="block text-sm font-semibold mt-3">Your Service Fee (e.g. ₱50 for delivery to Payompon)<input type="number" min="1" step="any" required value=${p} onInput=${e=>setP(e.target.value)}/></label>
    <label class="block text-sm font-semibold mt-3">Message to customer (optional, e.g. Mahal pamasahe malayo)<input maxLength="200" value=${m} onInput=${e=>setM(e.target.value)}/></label>
    <div class="flex justify-end gap-2 mt-4"><button type="button" class=${B3} onClick=${close}>Cancel</button><button class=${B2}>Send Offer</button></div></form></div>`;
}
function PostModal({close,onSave}){
  const [f,setF]=useState({item:"",qty:"",store:"",description:"",budget:"",address:""});
  const set=k=>e=>setF({...f,[k]:e.target.value});
  useEffect(()=>{const k=e=>e.key==="Escape"&&close();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[]);
  const F=(t,k,p={})=>html`<label class="block text-sm font-semibold mt-3">${t}<input value=${f[k]} onInput=${set(k)} ...${p}/></label>`;
  return html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${e=>e.target===e.currentTarget&&close()}>
   <form role="dialog" aria-modal="true" aria-label="Post a request" class="bg-surface rounded-2xl p-5 w-full max-w-lg max-h-[92vh] overflow-auto" onSubmit=${e=>{e.preventDefault();onSave(f)}}>
    <h2 class="font-display text-2xl font-extrabold">Post a request</h2>
    ${F("Item name","item",{required:true,maxLength:80,placeholder:"e.g. Gamot"})}
    <div class="grid grid-cols-2 gap-3">${F("Quantity","qty",{required:true,maxLength:20})}${F("Budget (PHP) - LOCKED","budget",{required:true,type:"number",min:1,step:"any",placeholder:"300"})}</div>
    <p class="text-xs text-muted mt-1">LOCKED: this is the estimated cost of the item. It cannot be changed by the pasabuyer. The service fee comes from the offer you accept.</p>
    ${F("Store to buy from (P)","store",{required:true,maxLength:60})}${F("Delivery address (D)","address",{required:true,maxLength:100})}
    <label class="block text-sm font-semibold mt-3">Description<textarea rows="2" maxLength="200" value=${f.description} onInput=${set("description")} placeholder="Brand, size, other details"></textarea></label>
    <div class="flex justify-end gap-2 mt-4"><button type="button" class=${B3} onClick=${close}>Cancel</button><button class=${B1}>Post request</button></div></form></div>`;
}
function App(){
  const [ready,setReady]=useState(false),[cu,setCu]=useState(()=>rd(KS,null)),[page,setPage]=useState("home"),[sel,setSel]=useState(null),[post,setPost]=useState(false),[offer,setOffer]=useState(null),[toast,setToast]=useState(""),[,tick]=useState(0);
  useEffect(()=>{ensureSeed().then(()=>setReady(true))},[]);
  useEffect(()=>{const f=()=>tick(n=>n+1),i=setInterval(f,1500),s=e=>{if(!e.key||e.key===KS)setCu(rd(KS,null));f()};window.addEventListener("storage",s);return()=>{clearInterval(i);window.removeEventListener("storage",s)}},[]);
  const say=m=>{setToast(m);setTimeout(()=>setToast(""),2600)};
  if(!ready)return html`<p class="p-8">Loading…</p>`;
  const valid=cu&&users().some(u=>u.id===cu.id&&u.role===cu.role&&u.email===cu.email);
  if(!valid)return html`<${Login} onAuth=${u=>{const s={id:u.id,name:u.name,email:u.email,role:u.role};wr(KS,s);setCu(s);setPage("home")}}/>`;
  const go=p=>{setPage(p);window.scrollTo(0,0)},cust=cu.role==="Customer";
  const a={
    offer:id=>{const r=reqs().find(x=>x.id===id);if(r&&canOffer(r,cu))setOffer(id);else say("You already have an active offer on this request.")},
    acc:(id,o)=>{if(acceptOffer(cu,id,o)){say("Offer accepted. Rider assigned, GPS is open.");setSel(id);go("gps")}else say("Could not accept this offer.")},
    dec:(id,o)=>{declineOffer(cu,id,o)?say("Offer declined"):say("Could not decline this offer.")},
    step:(id,s)=>{const q=reqs().find(x=>x.id===id);if(s==="Delivered"&&q&&q.actualPrice==null){say("Confirm the actual price first (Magkano actual na binili?).");return}setStep(cu,id,s)?say("Status: "+s):say("Only the assigned pasabuyer can update the status.")},
    actual:(id,p,img)=>{setActual(cu,id,p,img)?say("Actual price confirmed. Customer notified in chat."):say("Could not save the actual price.")},
    settle:(id,y)=>{confirmSettle(cu,id,y)?say(y?"Salamat! Confirmed.":"Noted. Please settle with the rider in chat."):say("Could not save.")},
    rate:(id,s,c)=>{rateRider(cu,id,s,c)?say("Thanks for rating"):say("You can rate only once per delivered request.")},
    chat:id=>{setSel(id);go("chat")},track:id=>{setSel(id);go("gps")}};
  const nav=[["home","Home"],["dash","Dashboard"],["board","Request Board"],["gps","GPS Tracking"],["chat","Chat"]];
  const openPost=()=>cust?setPost(true):say("Only customers can post requests.");
  const offerReq=offer&&reqs().find(x=>x.id===offer);
  return html`<div>
   <header class="bg-gradient-to-r from-violet-900 via-violet-700 to-fuchsia-700 text-white"><div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
    <${Logo} cls="h-12 w-auto" onClick=${()=>go("home")}/>
    <nav class="flex flex-wrap gap-1" aria-label="Main">${nav.map(([k,l])=>html`<button key=${k} onClick=${()=>go(k)} aria-current=${page===k?"page":undefined} class=${"px-3 py-2 rounded-lg font-semibold "+(page===k?"bg-white/25":"hover:bg-white/10")}>${l}</button>`)}</nav>
    <div class="flex flex-wrap items-center gap-2">
     <span class="bg-amber-300 text-black font-bold rounded-full px-3 py-1 text-sm">Role: ${cu.role}</span><span class="text-sm">${cu.name}</span>
     ${cust&&html`<button class=${B2+" !py-1.5 text-sm"} onClick=${openPost}>Post Request</button>`}
     <button class=${BTN+"border border-white/50 !py-1.5 text-sm"} onClick=${()=>{try{localStorage.removeItem(KS)}catch(e){}setCu(null)}}>Log out</button></div></div></header>
   <main class="max-w-6xl mx-auto px-4 py-6">
    ${page==="home"&&html`<${Home} cu=${cu} go=${go} openPost=${openPost}/>`}
    ${page==="dash"&&html`<${Dash} cu=${cu} a=${a} openPost=${openPost}/>`}
    ${page==="board"&&html`<${Board} cu=${cu} a=${a} openPost=${openPost}/>`}
    ${page==="gps"&&html`<${Gps} cu=${cu} sel=${sel} setSel=${setSel} a=${a}/>`}
    ${page==="chat"&&html`<${Chat} cu=${cu} sel=${sel} setSel=${setSel} say=${say} a=${a}/>`}
   </main>
   ${post&&html`<${PostModal} close=${()=>setPost(false)} onSave=${f=>{if(postRequest(cu,f)){setPost(false);go("board");say("Request posted. Pasabuyers can now send offers.")}else say("Only customers can post requests.")}}/>`}
   ${offerReq&&html`<${OfferModal} r=${offerReq} close=${()=>setOffer(null)} onSend=${(p,m)=>{if(sendOffer(cu,offer,p,m)){setOffer(null);say("Offer sent to the customer")}else say("Enter a valid service fee.")}}/>`}
   ${toast&&html`<div role="status" class="fixed left-1/2 -translate-x-1/2 bottom-5 bg-ink text-bg px-4 py-2 rounded-xl z-[60]">${toast}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
